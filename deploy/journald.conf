# /etc/systemd/journald.conf.d/ezconfig-platform.conf, installed by provision.sh.
# The journal is the platform's only log: 30 days and at most 2 GB, both set
# explicitly (Ubuntu's default allows up to 4 GB on this disk, with no age limit).
[Journal]
Storage=persistent
SystemMaxUse=2G
MaxRetentionSec=30day
