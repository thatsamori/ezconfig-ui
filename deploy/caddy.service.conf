# /etc/systemd/system/caddy.service.d/ezconfig-platform.conf, installed by
# provision.sh. The Caddyfile reads PUBLIC_HOSTNAME, PLATFORM_HOSTNAME and
# ACME_EMAIL from here.
[Unit]
# provision.sh creates the file empty; Caddy starts once it is filled.
ConditionFileNotEmpty=/etc/ezconfig-platform/caddy.env

[Service]
EnvironmentFile=/etc/ezconfig-platform/caddy.env
