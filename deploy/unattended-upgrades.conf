// /etc/apt/apt.conf.d/52ezconfig-platform, installed by provision.sh.
// Install security updates daily (Ubuntu's unattended-upgrades defaults to the
// security pocket). When one needs a reboot, reboot at 10:00 on the instance's
// clock, which provision.sh sets to UTC: between EU and NA evenings.
APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-Time "10:00";
